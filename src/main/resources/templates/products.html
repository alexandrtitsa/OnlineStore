<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Products - Online Store</title>
</head>
<body>
<div th:fragment="content">
    <h2 class="mb-4">Available Products</h2>

    <div id="productsContainer" class="row">
        <div class="col-12 text-center">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    <script>
        async function loadProducts() {
            try {
                // Since we don't have a list endpoint, we'll show a message
                // In production, you'd add GET /api/products endpoint
                document.getElementById('productsContainer').innerHTML = `
                        <div class="col-12">
                            <div class="alert alert-info">
                                <h4>Sample Products</h4>
                                <p>Products are loaded from the database. Check your database for available products.</p>
                                <p>You can view individual products by ID at: <code>GET /api/products/{productId}</code></p>
                            </div>
                        </div>
                    `;

            } catch (error) {
                showAlert('danger', 'Failed to load products');
            }
        }

        loadProducts();
    </script>
</div>
</body>
</html>
