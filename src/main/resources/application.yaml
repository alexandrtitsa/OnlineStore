spring:
  application:
    name: online-store

  datasource:
    url: jdbc:postgresql://localhost:5432/onlinestore
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  main:
    banner-mode: off

# JWT Configuration - ЦЕ КРИТИЧНО ВАЖЛИВО!
jwt:
  secret: your-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-make-it-even-longer-for-better-security
  access-token-expiration-minutes: 15
  refresh-token-expiration-days: 7

# Server Configuration
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# Logging
logging:
  level:
    com.onlinestore: DEBUG
    org.springframework.security: DEBUG

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    custom-css-url: /swagger-custom.css
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true
    default-models-expand-depth: 1
    default-model-expand-depth: 1
  show-actuator: false
